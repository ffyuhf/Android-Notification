# GitHub Actions 构建工作流
# 触发条件：push 到 main 分支、Pull Request、手动触发、推送 v* 标签
# 功能：编译 Android APK；tag 触发时自动签名并发布到 GitHub Release
# 创建日期：2026-05-14 | 作者：Cline

name: Android CI Build

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]        # 推送 v 开头的 tag 时触发发版
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# 避免同一分支多次并发构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# 标记当前是否为 tag 触发
env:
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # 创建 Release 需要写权限

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. 设置 JDK 25（升级 2026-09-13 | 批次一：JDK 17 太老，升至最新 LTS 25，
      #    与 app 构建脚本 jvmToolchain(25) 锚定一致；Gradle 9.7.1 官方支持 JVM 17-26）
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      # 2a-pre. 动态下载 wrapper JAR（新增 2026-09-13 23:38 | 修复 Wrapper Validation 失败：
      #     仓库不含 gradle-wrapper.jar，CI 检出后从 Gradle 官方仓库动态下载、用后即弃。
      #     来源：用户指示 2026-09-13 23:33「JAR不入库、CI构建时下载、用后即弃」（D1 裁决）。
      #     版本号单一来源：gradle-wrapper.properties 的 distributionUrl——
      #     升级 Gradle 仅改该文件，本步骤自动跟随，杜绝两处版本漂移；
      #     下载源为官方不可变 tag 引用，--retry 3 抗网络抖动，-f 确保 HTTP 错误即失败）
      - name: Download Gradle wrapper JAR
        run: |
          GRADLE_VER=$(sed -n \
            's/^distributionUrl=.*gradle-\([0-9.]*\)-bin\.zip/\1/p' \
            gradle/wrapper/gradle-wrapper.properties)
          echo "Downloading gradle-wrapper.jar for Gradle ${GRADLE_VER}"
          curl -fL --retry 3 -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VER}/gradle/wrapper/gradle-wrapper.jar"

      # 2a. 校验 Gradle wrapper 完整性（新增 2026-09-13 | 批次一 D5，来源：用户确认 Q3选B；
      #     F-Droid 官方推荐做法，防 gradle-wrapper.jar 供应链篡改。
      #     升级 2026-09-13 23:38 | 旧 gradle/wrapper-validation-action 已官方弃用，替换为
      #     gradle/actions/wrapper-validation@v6：校验上一步动态下载的 JAR checksum，
      #     同时消除 DEPRECATION / Node 20 / punycode 警告）
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # 3. 缓存 Gradle 依赖
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # 4. 授予 gradlew 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4a. 依赖锁定前置（改造 2026-09-14 00:43 | 依赖锁定Lockfile落盘修复，用户裁决 Q1=A）：
      #     lockfile 已提交仓库则跳过；缺失时以官方 resolveAndLockAll 任务全量写锁
      #     （dependencies 报告任务在本栈实测退出码 0 却不落盘，已废弃）；生成后硬校验
      #     非空，失败立即红并报明确错误，杜绝静默通过后在 STRICT 解析处爆出模糊失败
      - name: Ensure dependency locks present
        run: |
          test -f app/gradle.lockfile || ./gradlew :app:resolveAndLockAll --write-locks --stacktrace
          test -s app/gradle.lockfile || { echo "::error::app/gradle.lockfile 未生成或为空——resolveAndLockAll 写锁失败"; exit 1; }

      # 5. 仅 tag 触发：把 tag 版本号写入 versionName/versionCode
      #    v1.2.3 -> versionName "1.2.3"；versionCode 由语义版确定性派生
      #    （改造 2026-09-13 | 批次一 D4，来源：用户确认 Q3选B：
      #     MAJOR*10000+MINOR*100+PATCH，如 v1.0.0->10000；
      #     同 tag 重跑 CI 产出完全一致——可重复构建闭环，替代原 github.run_number 注入）
      - name: Inject version from tag
        if: env.IS_TAG == 'true'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MAJOR=$(echo "$TAG" | cut -d. -f1)
          MINOR=$(echo "$TAG" | cut -d. -f2)
          PATCH=$(echo "$TAG" | cut -d. -f3)
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          for f in app/build.gradle app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E "s/versionCode = [0-9]+/versionCode = ${CODE}/; s/versionCode [0-9]+/versionCode ${CODE}/" "$f"
            sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${TAG}\"/; s/versionName \"[^\"]+\"/versionName \"${TAG}\"/" "$f"
          done

      # 6. 仅 tag 触发：解出签名密钥
      - name: Decode signing keystore
        if: env.IS_TAG == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.keystore

      # 7. 构建 Debug APK（tag 触发时跳过）
      - name: Build Debug APK
        if: env.IS_TAG != 'true'
        run: ./gradlew assembleDebug --stacktrace

      # 8. 上传 Debug APK 到 Artifacts
      - name: Upload Debug APK
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 9. 构建 Release APK（main/master 或 tag 触发）
      - name: Build Release APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || env.IS_TAG == 'true'
        env:
          KEYSTORE_PATH: ${{ env.IS_TAG == 'true' && format('{0}/release.keystore', github.workspace) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # 10. 上传 Release APK 到 Artifacts（仅分支构建；tag 构建直接进 Release）
      - name: Upload Release APK
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.IS_TAG != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      # 11. 仅 tag 触发：把 APK 挂到 GitHub Release
      - name: Publish APK to GitHub Release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      # 动态下载 wrapper JAR（新增 2026-09-13 23:38 | 用户指示 D1 裁决：JAR 不入库、CI 用后即弃；
      # 版本读自 gradle-wrapper.properties 单一来源，实现同 build job 同名步骤）
      - name: Download Gradle wrapper JAR
        run: |
          GRADLE_VER=$(sed -n \
            's/^distributionUrl=.*gradle-\([0-9.]*\)-bin\.zip/\1/p' \
            gradle/wrapper/gradle-wrapper.properties)
          echo "Downloading gradle-wrapper.jar for Gradle ${GRADLE_VER}"
          curl -fL --retry 3 -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VER}/gradle/wrapper/gradle-wrapper.jar"

      # 校验升级 v6（2026-09-13 23:38 | 旧 action 已弃用，校验对象为动态下载的 JAR）
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 依赖锁定前置（改造 2026-09-14 00:43 | 同 build job 实现，用户裁决 Q1=A）：
      # resolveAndLockAll 全量写锁 + 非空硬校验，替换实测不落盘的 dependencies --write-locks
      - name: Ensure dependency locks present
        run: |
          test -f app/gradle.lockfile || ./gradlew :app:resolveAndLockAll --write-locks --stacktrace
          test -s app/gradle.lockfile || { echo "::error::app/gradle.lockfile 未生成或为空——resolveAndLockAll 写锁失败"; exit 1; }

      - name: Run Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

  # 依赖锁定 lockfile 生成与自动入库作业（新增 2026-09-13 | 批次一 D3；改造 2026-09-14 00:43 |
  # 依赖锁定Lockfile落盘修复，用户裁决 Q1=A/Q2=B + 用户工作流"不在本机运行，仅上传到GitHub编译验证"）：
  # 手动触发 → resolveAndLockAll 生成 app/gradle.lockfile → 与仓库比对有差异即自动 commit+push
  # 入库（作者 github-actions[bot]）；artifact 保留为自动提交失败时的人工回退取回通道。
  # 注意：GITHUB_TOKEN 推送的 commit 不触发新 workflow run（GitHub 防递归规则），入库后需
  # 手动触发一次 Android CI Build 做 STRICT 实跑验证；此后 build/lint 严格按入库 lockfile 解析
  write-locks:
    name: Generate Dependency Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write      # lockfile 自动 commit+push 需要（用户裁决 Q2=B）

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      # 动态下载 wrapper JAR（新增 2026-09-13 23:38 | 用户指示 D1 裁决：JAR 不入库、CI 用后即弃；
      # 版本读自 gradle-wrapper.properties 单一来源，实现同 build job 同名步骤；
      # 本 job 无 Cache 步骤，下载后直接校验→授权→生成 lockfile）
      - name: Download Gradle wrapper JAR
        run: |
          GRADLE_VER=$(sed -n \
            's/^distributionUrl=.*gradle-\([0-9.]*\)-bin\.zip/\1/p' \
            gradle/wrapper/gradle-wrapper.properties)
          echo "Downloading gradle-wrapper.jar for Gradle ${GRADLE_VER}"
          curl -fL --retry 3 -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VER}/gradle/wrapper/gradle-wrapper.jar"

      # 校验升级 v6（2026-09-13 23:38 | 旧 action 已弃用，校验对象为动态下载的 JAR）
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 写锁命令（改造 2026-09-14 00:43 | 用户裁决 Q1=A）：官方 resolveAndLockAll 任务
      # 全量落盘，替换实测不落盘的 dependencies --write-locks
      - name: Write dependency locks
        run: ./gradlew :app:resolveAndLockAll --write-locks --stacktrace

      # 自动入库（新增 2026-09-14 00:43 | 依赖锁定Lockfile落盘修复，用户裁决 Q2=B）：
      # lockfile 与仓库内容有差异时自动 commit+push；无变化则跳过（不自动更新依赖漂移，
      # 漂移仍由 build/lint 的 STRICT 严格拦截——更新 lockfile 必须经本 job 显式触发）
      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/gradle.lockfile
          if git diff --cached --quiet; then
            echo "lockfile 与仓库一致，无需提交"
          else
            git commit -m "chore: 生成 app/gradle.lockfile 依赖锁（write-locks job 自动入库，依据：依赖锁定Lockfile落盘修复计划 v1.0）"
            git push
            echo "::notice::lockfile 已入库。GITHUB_TOKEN 推送不触发新 CI run，请手动触发一次 Android CI Build 验证 STRICT 实跑"
          fi

      - name: Upload lockfile
        uses: actions/upload-artifact@v7
        with:
          name: gradle-lockfile
          path: app/gradle.lockfile
          retention-days: 30
