# GitHub Actions 构建工作流
# 触发条件：push 到 main 分支、Pull Request、手动触发、推送 v* 标签
# 功能：编译 Android APK；tag 触发时自动签名并发布到 GitHub Release
# 创建日期：2026-05-14 | 作者：Cline

name: Android CI Build

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]        # 推送 v 开头的 tag 时触发发版
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# 避免同一分支多次并发构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# 标记当前是否为 tag 触发
env:
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # 创建 Release 需要写权限

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. 设置 JDK 25（升级 2026-09-13 | 批次一：JDK 17 太老，升至最新 LTS 25，
      #    与 app 构建脚本 jvmToolchain(25) 锚定一致；Gradle 9.7.1 官方支持 JVM 17-26）
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      # 2a. 校验 Gradle wrapper 完整性（新增 2026-09-13 | 批次一 D5，来源：用户确认 Q3选B；
      #     F-Droid 官方推荐做法，防 gradle-wrapper.jar 供应链篡改）
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      # 3. 缓存 Gradle 依赖
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # 4. 授予 gradlew 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4a. 依赖锁定前置（新增 2026-09-13 | 批次一 D3）：lockfile 已提交仓库则跳过，
      #     缺失时现场生成（--write-locks 是 STRICT 模式下写入 lock state 的合法途径）；
      #     正式 lockfile 经 write-locks job（手动触发）生成取回提交
      - name: Ensure dependency locks present
        run: test -f app/gradle.lockfile || ./gradlew dependencies --write-locks --stacktrace

      # 5. 仅 tag 触发：把 tag 版本号写入 versionName/versionCode
      #    v1.2.3 -> versionName "1.2.3"；versionCode 由语义版确定性派生
      #    （改造 2026-09-13 | 批次一 D4，来源：用户确认 Q3选B：
      #     MAJOR*10000+MINOR*100+PATCH，如 v1.0.0->10000；
      #     同 tag 重跑 CI 产出完全一致——可重复构建闭环，替代原 github.run_number 注入）
      - name: Inject version from tag
        if: env.IS_TAG == 'true'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MAJOR=$(echo "$TAG" | cut -d. -f1)
          MINOR=$(echo "$TAG" | cut -d. -f2)
          PATCH=$(echo "$TAG" | cut -d. -f3)
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          for f in app/build.gradle app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E "s/versionCode = [0-9]+/versionCode = ${CODE}/; s/versionCode [0-9]+/versionCode ${CODE}/" "$f"
            sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${TAG}\"/; s/versionName \"[^\"]+\"/versionName \"${TAG}\"/" "$f"
          done

      # 6. 仅 tag 触发：解出签名密钥
      - name: Decode signing keystore
        if: env.IS_TAG == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.keystore

      # 7. 构建 Debug APK（tag 触发时跳过）
      - name: Build Debug APK
        if: env.IS_TAG != 'true'
        run: ./gradlew assembleDebug --stacktrace

      # 8. 上传 Debug APK 到 Artifacts
      - name: Upload Debug APK
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 9. 构建 Release APK（main/master 或 tag 触发）
      - name: Build Release APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || env.IS_TAG == 'true'
        env:
          KEYSTORE_PATH: ${{ env.IS_TAG == 'true' && format('{0}/release.keystore', github.workspace) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # 10. 上传 Release APK 到 Artifacts（仅分支构建；tag 构建直接进 Release）
      - name: Upload Release APK
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.IS_TAG != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      # 11. 仅 tag 触发：把 APK 挂到 GitHub Release
      - name: Publish APK to GitHub Release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure dependency locks present
        run: test -f app/gradle.lockfile || ./gradlew dependencies --write-locks --stacktrace

      - name: Run Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

  # 依赖锁定 lockfile 生成作业（新增 2026-09-13 | 批次一 D3，来源：用户确认 Q3选B + 用户工作流
  # "不在本机运行，仅上传到GitHub编译验证"）：手动触发生成 app/gradle.lockfile 并上传 artifact，
  # 取回提交仓库一次即完成；此后 build/lint 的 STRICT 模式严格按 lockfile 解析
  write-locks:
    name: Generate Dependency Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write dependency locks
        run: ./gradlew dependencies --write-locks --stacktrace

      - name: Upload lockfile
        uses: actions/upload-artifact@v7
        with:
          name: gradle-lockfile
          path: app/gradle.lockfile
          retention-days: 30
