# 依赖版本目录（Version Catalog）
# 统一管理所有依赖版本，确保版本一致性

[versions]
# SDK
minSdk = "26"
targetSdk = "36"
compileSdk = "36"

# Kotlin & Android
# 全线升级至最新稳定线（2026-09-13 | 批次一 B1-B3，版本经 Google Maven/Maven Central 实查：
#   AGP 9.4.0 明确支持 compileSdk 36+；用户确认 Q1选B+AGP9.4.0）
# Kotlin/KSP 升级至 2.3 线（2026-09-14 | Kotlin23线升级修复，用户裁决 Q1=B，Maven 实查定稿）：
#   旧 KSP 2.2.21-2.0.5（曾用于 2026-09-13~09-14，<kotlin>-<ksp> 旧版本号制末代）无条件拒绝
#   AGP 9 内置 Kotlin（CI 致命诊断）；KSP 2.3.0 起版本号独立制并支持内置 Kotlin
#   （门槛 AGP≥9.0.0-alpha14，本项目 9.4.0 满足），且官方声明"不再与 Kotlin 编译器版本绑定"
agp = "9.4.0"
kotlin = "2.3.21"
ksp = "2.3.12"

# Compose
composeBom = "2024.12.01"
activityCompose = "1.9.3"
navigationCompose = "2.8.5"

# AndroidX Core
coreKtx = "1.15.0"
appcompat = "1.7.0"
lifecycle = "2.8.7"
splashScreen = "1.0.1"

# Room
room = "2.6.1"

# DataStore
datastore = "1.1.1"

# WorkManager
workManager = "2.10.0"

# Testing
junit = "4.13.2"
junitExt = "1.2.1"
espresso = "3.6.1"

[libraries]
# Compose BOM
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# AndroidX Core
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashScreen" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# WorkManager
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-ext = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
# kotlin-android 条目移除（2026-09-13 23:57 | AGP9内置Kotlin迁移，用户裁决 Q1=C）：
# AGP 9.0 起 Kotlin 支持内置于 AGP，该插件三处声明全清；kotlin 版本条目保留——
# kotlin-compose 仍引用（version.ref = "kotlin"）
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
